name: Deploy

# Cada push a main redespliega en el VPS. Crea un GitHub Deployment (environment: production).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # La llave del VPS esta restringida con command="..." en authorized_keys:
      # el comando que pasemos aqui se ignora y siempre corre el script de deploy.
      #
      # MAPBOX_PUBLIC_TOKEN (secret de GitHub: del environment "production" o del repo) viaja por SSH con SendEnv, no en el comando ni en un archivo.
      # El VPS tiene que aceptarla (AcceptEnv MAPBOX_PUBLIC_TOKEN en sshd_config) y su script de deploy exportarla antes del docker compose; si no,
      # SendEnv se ignora en silencio y el servidor sigue con Nominatim/OpenStreetMap (lo dice en su log al arrancar). Ver README, "Mapa del Feed".
      # Nunca se imprime: aqui no hay echo de la variable ni `set -x`, y GitHub enmascara el valor en los logs.
      - name: Desplegar
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o SendEnv=MAPBOX_PUBLIC_TOKEN "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" deploy
