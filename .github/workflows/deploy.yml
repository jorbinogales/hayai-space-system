name: Deploy

# Cada push a main redespliega en el VPS. Crea un GitHub Deployment (environment: production).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # La llave del VPS esta restringida con command="..." en authorized_keys:
      # el comando que pasemos aqui se ignora y siempre corre deploy/deploy.sh.
      # La config viaja por stdin (KEY=VALUE, solo las no vacias); deploy.sh la aplica
      # al .env del VPS con deploy/apply-env.sh. Para agregar una variable: ponla aqui (en env y
      # en la lista del for), en docker-compose.prod.yml y en Settings > Secrets/Variables.
      - name: Desplegar
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          RECEIVER_DOCUMENTS: ${{ secrets.RECEIVER_DOCUMENTS }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
          META_LEADS_ENABLED: ${{ vars.META_LEADS_ENABLED }}
          META_LEADS_OWNER: ${{ vars.META_LEADS_OWNER }}
          SYSTEMS_CHECK_MS: ${{ vars.SYSTEMS_CHECK_MS }}
        run: |
          for k in POSTGRES_PASSWORD META_APP_SECRET META_VERIFY_TOKEN META_PAGE_TOKEN RECEIVER_DOCUMENTS MAPBOX_PUBLIC_TOKEN DEEPSEEK_API_KEY DOMAIN META_LEADS_ENABLED META_LEADS_OWNER SYSTEMS_CHECK_MS; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v"; fi
          done | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" deploy
