# nginx como proxy hacia la API de HAYAI (contenedor publicado en 127.0.0.1:3001).
# Copia a /etc/nginx/sites-available/hayai, enlaza en sites-enabled, y luego:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d space.hayai.com.ve      # agrega el HTTPS y la redireccion
server {
    listen 80;
    server_name space.hayai.com.ve;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
