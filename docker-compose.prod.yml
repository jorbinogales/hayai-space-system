# Produccion en un VPS: Postgres + API/web, y opcionalmente Caddy (HTTPS automatico).
# - VPS con OTROS sitios (nginx/Apache ya usan 80/443):  docker compose -f docker-compose.prod.yml up -d --build
#   La API queda en 127.0.0.1:3001 y tu nginx/Apache hace de proxy (ver deploy/nginx-hayai.conf).
# - VPS libre (nada en 80/443):  docker compose -f docker-compose.prod.yml --profile caddy up -d --build
# Antes:  cp .env.production.example .env  (editalo)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hayai
      POSTGRES_DB: hayai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayai -d hayai"]
      interval: 5s
      timeout: 5s
      retries: 10
    # sin "ports": Postgres solo es visible para los otros contenedores, nunca desde internet

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hayai:${POSTGRES_PASSWORD}@db:5432/hayai
      NODE_ENV: production
      TRUST_PROXY: "1" # Caddy va delante: asi el limite por IP ve la IP real
      PORT: "3001"
      # Leads de Meta Ads (webhook): apagado hasta tener las credenciales. Ver README, "Meta Lead Ads".
      META_LEADS_ENABLED: ${META_LEADS_ENABLED:-false}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_PAGE_TOKEN: ${META_PAGE_TOKEN:-}
      META_LEADS_OWNER: ${META_LEADS_OWNER:-Elis,Jorbi,Leandro}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001" # solo accesible desde el propio VPS (nginx/Apache); nunca desde internet

  caddy:
    image: caddy:2
    profiles: ["caddy"] # solo si el VPS tiene libres los puertos 80 y 443
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
